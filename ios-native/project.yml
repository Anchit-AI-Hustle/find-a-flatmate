name: FindAFlatmate
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  FindAFlatmate:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Find a Flatmate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.findaflatmate.app
            CFBundleURLSchemes: [findaflatmate]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.findaflatmate.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
